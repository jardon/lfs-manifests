name: "m4"
version: "1.4.21"
license: "GPL-3.0-or-later"
arch: x86_64

source:
  url: "https://ftpmirror.gnu.org/m4/m4-1.4.21.tar.xz"
  md5: "8051eef7239b2f187791f2ab0034d6b7"

engine: "podman"
base: "docker.io/jardon/pass-1:resolute@sha256:3f83485cb4cd647ee755bb88cf86f395a681ef28d6bb12221dcaff8ac9c922a0"

plugin:
  name: "none"

build:
  override-steps: |
    ./configure \
      --prefix=/usr \
      --host=$ZPKG_ARCH-lfs-linux-gnu \
      --build=$(build-aux/config.guess)

    make
    make DESTDIR=$ZPKG_DEST install
