name: "binutils"
version: "2.46.0"
license: "GPL-3.0-or-later"
arch: x86_64

source:
  url: https://sourceware.org/pub/binutils/releases/binutils-2.46.0.tar.xz
  md5: "81bb6810bcd1119819dc0804956e1c92"

engine: "podman"
base: "docker.io/jardon/autotools:resolute@sha256:fab64c7c65e0413e02cb3dc7ca3f66978be4cbaab916054bb44f902ad1a55858"

plugin:
  name: "autotools"
  configure-args:
    - "--prefix=/usr"
    - "--with-sysroot=$ZPKG_DEST"
    - "--target=$ZPKG_ARCH-lfs-linux-gnu"
    - "--disable-nls"
    - "--enable-gprofng=no"
    - "--disable-werror"
    - "--enable-new-dtags"
    - "--enable-default-hash-style=gnu"
