name: "binutils"
version: "2.46.0"
license: "GPL-3.0-or-later"
arch: x86_64

source:
  url: https://sourceware.org/pub/binutils/releases/binutils-2.46.0.tar.xz
  md5: "81bb6810bcd1119819dc0804956e1c92"

engine: "podman"
base: "docker.io/jardon/autotools:latest@sha256:24711b7f15f8fff225cfe386ad503c2c73808fd42c2afec558417af2bd7f533b"

plugin:
  name: "autotools"
  configure-args:
    - "--prefix=/usr"
    - "--with-sysroot=$ZPKG_DEST"
    - "--target=$ZPKG_ARCH-lfs-linux-gnu"
    - "--disable-nls"
    - "--enable-gprofng=no"
    - "--disable-werror"
    - "--enable-new-dtags"
    - "--enable-default-hash-style=gnu"
