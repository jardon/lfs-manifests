name: "libstdcxx"
version: "15.2.0"
license: "GPL-3.0-or-later"
arch: amd64

source:
  url: https://ftpmirror.gnu.org/gcc/gcc-15.2.0/gcc-15.2.0.tar.xz
  md5: "b861b092bf1af683c46a8aa2e689a6fd"

engine: "podman"
base: "docker.io/jardon/autotools:resolute@sha256:fab64c7c65e0413e02cb3dc7ca3f66978be4cbaab916054bb44f902ad1a55858"

plugin:
  name: "none"

build:
  override-steps: |
    mkdir -v $ZPKG_BUILD/build
    cd $ZPKG_BUILD/build

    ../libstdc++-v3/configure      \
        --host=$ZPKG_ARCH-lfs-linux-gnu            \
        --build=$(../config.guess) \
        --prefix=/usr              \
        --disable-multilib         \
        --disable-nls              \
        --disable-libstdcxx-pch    \
        --with-gxx-include-dir=/$ZPKG_ARCH-lfs-linux-gnu/include/c++/15.2.0

    make
    make install DESTDIR=$ZPKG_DEST

    rm -v $ZPKG_DEST/usr/lib/lib{stdc++{,exp,fs},supc++}.la


