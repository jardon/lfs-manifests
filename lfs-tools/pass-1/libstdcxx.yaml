name: "libstdcxx"
version: "15.2.0"
license: "GPL-3.0-or-later"
arch: amd64

source:
  url: https://ftpmirror.gnu.org/gcc/gcc-15.2.0/gcc-15.2.0.tar.xz
  md5: "b861b092bf1af683c46a8aa2e689a6fd"

engine: "podman"
base: "docker.io/jardon/autotools:latest@sha256:24711b7f15f8fff225cfe386ad503c2c73808fd42c2afec558417af2bd7f533b"

plugin:
  name: "none"

build:
  override-steps: |
    mkdir -v $ZPKG_BUILD/build
    cd $ZPKG_BUILD/build

    ../libstdc++-v3/configure      \
        --host=$ZPKG_ARCH-lfs-linux-gnu            \
        --build=$(../config.guess) \
        --prefix=/usr              \
        --disable-multilib         \
        --disable-nls              \
        --disable-libstdcxx-pch    \
        --with-gxx-include-dir=/usr/include

    make
    make install DESTDIR=$ZPKG_DEST

    rm -v $ZPKG_DEST/usr/lib/lib{stdc++{,exp,fs},supc++}.la


