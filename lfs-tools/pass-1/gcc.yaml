name: "gcc"
version: "15.2.0"
license: "GPL-3.0-or-later"
arch: x86_64

source:
  url: https://ftpmirror.gnu.org/gcc/gcc-15.2.0/gcc-15.2.0.tar.xz
  md5: "b861b092bf1af683c46a8aa2e689a6fd"

engine: "podman"
base: "docker.io/jardon/autotools:resolute@sha256:fab64c7c65e0413e02cb3dc7ca3f66978be4cbaab916054bb44f902ad1a55858"

plugin:
  name: "none"

build:
  env:
    SYSROOT: /opt/tools
  override-steps: |
    ln -s /bin/bash /zpkg-build-workspace/components/gcc/build/tools/usr/bin/sh
    cd $ZPKG_BUILD
    case $(uname -m) in
      x86_64)
        sed -e '/m64=/s/lib64/lib/' \
            -i.orig gcc/config/i386/t-linux64
     ;;
    esac

    export PATH=$ZPKG_DEST/usr/bin:$ZPKG_BUILD/tools/usr/bin:$PATH

    mkdir -v $ZPKG_BUILD/build
    cd $ZPKG_BUILD/build

    ../configure \
      --target=$ZPKG_ARCH-lfs-linux-gnu \
      --prefix=$ZPKG_DEST/usr \
      --with-glibc-version=2.43 \
      --with-sysroot=$SYSROOT \
      --with-newlib \
      --without-headers \
      --enable-default-pie \
      --enable-default-ssp \
      --disable-nls \
      --disable-shared \
      --disable-multilib \
      --disable-threads \
      --disable-libatomic \
      --disable-libgomp \
      --disable-libquadmath \
      --disable-libssp \
      --disable-libvtv \
      --disable-libstdcxx \
      --enable-languages=c,c++

    make
    make install

    cd $ZPKG_BUILD
    mkdir -p $ZPKG_DEST/usr/include
    cat gcc/limitx.h gcc/glimits.h gcc/limity.h > \
    `dirname $($ZPKG_ARCH-lfs-linux-gnu-gcc -print-libgcc-file-name)`/include/limits.h

  dependencies:
    - name: "gmp"
      version: "6.3.0"
      source: "https://ftpmirror.gnu.org/gmp/gmp-6.3.0.tar.xz"
      md5: "956dc04e864001a9c22429f761f2c283"
      extract-to: "/zpkg-build-workspace/components/gcc/build"
      rename: "gmp"

    - name: "mpc"
      version: "1.3.1"
      source: "https://ftpmirror.gnu.org/mpc/mpc-1.3.1.tar.gz"
      md5: "5c9bc658c9fd0f940e8e3e0f09530c62"
      extract-to: "/zpkg-build-workspace/components/gcc/build"
      rename: "mpc"

    - name: "mpfr"
      version: "4.2.2"
      source: "https://ftpmirror.gnu.org/mpfr/mpfr-4.2.2.tar.xz"
      md5: "7c32c39b8b6e3ae85f25156228156061"
      extract-to: "/zpkg-build-workspace/components/gcc/build"
      rename: "mpfr"

    - name: "binutils"
      version: "2.46.0"
      source: "https://github.com/jardon/archives/releases/download/systemd-13/binutils-2.46.0-x86_64.tar.xz"
      sha256: "3534c29adc834393ec9ed74251c33e05df52d971f0ba6dfeb81f389b8881c05f"
      extract-to: "/zpkg-build-workspace/components/gcc/build/tools"
