name: "linux-headers"
version: "6.18.10"
license: "GPL-3.0-or-later"
arch: x86_64

source:
  url: https://www.kernel.org/pub/linux/kernel/v6.x/linux-6.18.10.tar.xz
  md5: "660e706a43f634b1fcd911f8839d2f61"

engine: "podman"
base: "docker.io/jardon/autotools:resolute@sha256:fab64c7c65e0413e02cb3dc7ca3f66978be4cbaab916054bb44f902ad1a55858"

plugin:
  name: "none"

build:
  override-steps: |
      make mrproper
      make headers
      find usr/include -type f ! -name '*.h' -delete
      cp -rv usr/include $ZPKG_DEST/usr
